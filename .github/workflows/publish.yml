name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'specxai/moura'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install and verify staged publishing toolchain
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"
          node --version
          npm --version

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z; received: $RELEASE_TAG" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          release_version="${RELEASE_TAG#v}"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release tag version ($release_version) does not match package.json ($package_version)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Test installed package
        run: pnpm test:package

      - name: Check package contents
        run: pnpm pack --dry-run

      - name: Stage package for human approval
        run: npm stage publish
